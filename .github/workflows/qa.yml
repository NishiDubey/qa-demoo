name: QA Pipeline
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-report, path: reports/ }

  regression:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m "regression or api"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: regression-report, path: reports/ }
